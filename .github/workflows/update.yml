name: 기업마당 공고 매일 갱신

on:
  schedule:
    - cron: "52 20 * * *"   # 매일 오전 5시 52분 (한국시간)
  workflow_dispatch:         # Actions 탭에서 '지금 실행' 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 공고 가져오기
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
        run: python scripts/fetch_bizinfo.py
      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json
          if git diff --staged --quiet; then
            echo "바뀐 공고 없음"
          else
            git commit -m "공고 자동 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
